name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ubuntu-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python.exe -m unittest tests/test_rectangle.py tests/test_circle.py tests/test_square.py tests/test_triangle.py

  windows-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python.exe -m unittest tests/test_rectangle.py tests/test_circle.py tests/test_square.py tests/test_triangle.py
